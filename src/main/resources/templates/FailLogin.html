<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Login Failed - HeyFilm</title>
    <style>
        .feedback-container {
            max-width: 500px;
            margin: 100px auto;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
    </style>
</head>

<body class="bg-light">
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container">
        <div class="feedback-container">
            <div style="font-size: 4rem; color: #e74c3c; margin-bottom: 20px;">⚠️</div>
            <h1 style="color: var(--primary); font-weight: 800; margin-bottom: 15px;">Login Failed</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">The username or password you entered is incorrect.
                Please check your credentials and try again.</p>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <a th:href="@{/login}" class="button">Try Again</a>
                <a th:href="@{/ForgotPass}"
                    style="color: var(--accent); text-decoration: none; font-weight: 600;">Forgot Password?</a>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>
</body>

</html>
