<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - Movie Ticket Booking</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #7f8c8d;
        }

        .container {
            padding: 40px;
        }

        .hero-banner {
            background-color: #ecf0f1;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        .movie-listings {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .movie-card {
            width: 220px;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .movie-card:hover {
            transform: translateY(-10px);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h3 {
            margin: 10px 0;
            font-size: 20px;
            color: #34495e;
        }

        .movie-info p {
            font-size: 16px;
            color: #7f8c8d;
        }

        .button {
            padding: 10px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .no-results {
            font-size: 24px;
            color: #bdc3c7;
            text-align: center;
            margin-top: 50px;
        }
    </style>
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>

    <header>
        <div class="logo">MovieBooking</div>
        <nav id="nav-links">
            <a href="/home" style="color: white; margin: 0 15px; text-decoration: none;">Home</a>
            <a href="/movies" style="color: white; margin: 0 15px; text-decoration: none;">Movies</a>
        </nav>
    </header>

    <div class="container">
        <div class="hero-banner">
            <h2>Search Results for: "<span th:text="${query}"></span>"</h2>
        </div>

        <div class="movie-listings" th:if="${not #lists.isEmpty(results)}">
            <div class="movie-card" th:each="movie : ${results}">
                <img th:src="${movie.image}" th:alt="${movie.title}">
                <div class="movie-info">
                    <h3 th:text="${movie.title}">Movie Title</h3>
                    <p th:text="'Rating: ' + ${movie.rating}">Rating</p>
                    <p th:text="${movie.genre}">Genre</p>
                    <a th:href="@{/BookNow(movie=${movie.title})}" class="button">Book Now</a>
                </div>
            </div>
        </div>

        <div class="no-results" th:if="${#lists.isEmpty(results)}">
            <p>No movies found matching your search. Try another query!</p>
            <a href="/home" class="button" style="background-color: #34495e;">Back to Home</a>
        </div>
    </div>

</body>

</html>
