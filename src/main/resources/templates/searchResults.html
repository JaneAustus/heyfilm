<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Search Results - HeyFilm</title>
</head>

<body class="bg-light">

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container mt-5">
        <div class="section-header d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 style="font-weight: 800; color: var(--primary);">Search Results</h2>
                <p class="text-muted">Showing results for "<span th:text="${query}"
                        class="text-accent fw-bold">Query</span>"</p>
            </div>
            <a href="/home" class="button button-outline" style="padding: 10px 20px;">Back to Search</a>
        </div>

        <div class="movie-grid" th:if="${not #lists.isEmpty(results)}">
            <div class="movie-card" th:each="movie : ${results}">
                <div class="movie-poster">
                    <img th:src="${movie.image}" th:alt="${movie.title}"
                        onerror="this.src='https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80'">
                    <div class="movie-badge" th:text="${movie.rating + ' ★'}">4.5 ★</div>
                </div>
                <div class="movie-info">
                    <h3 th:text="${movie.title}">Movie Title</h3>
                    <p class="movie-genre" th:text="${movie.genre}">Genre</p>
                    <a th:href="@{/BookNow(movie=${movie.title})}" class="button">Book Now</a>
                </div>
            </div>
        </div>

        <div class="text-center py-5" th:if="${#lists.isEmpty(results)}">
            <div style="font-size: 5rem; margin-bottom: 20px;">🔍</div>
            <h3 style="font-weight: 700; color: var(--primary);">No movies found</h3>
            <p class="text-muted mb-4">We couldn't find anything matching your search. Try another keyword!</p>
            <a href="/home" class="button" style="display: inline-block;">Explore Homepage</a>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>

</body>

</html>
