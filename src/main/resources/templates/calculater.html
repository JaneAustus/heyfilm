<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Seat Calculator - HeyFilm Premium</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .calc-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 40px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .movie-picker {
            margin-bottom: 40px;
        }

        .movie-picker select {
            width: 100%;
            padding: 12px;
            background: #334155;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .screen {
            width: 100%;
            height: 6px;
            background: #3498db;
            margin: 40px 0;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .seat {
            width: 30px;
            height: 30px;
            background: #334155;
            border-radius: 5px;
            cursor: pointer;
            transition: var(--transition);
        }

        .seat:hover {
            transform: scale(1.1);
            background: #475569;
        }

        .seat.selected {
            background: #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.4);
        }

        .seat.occupied {
            background: #0f172a;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .summary {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.25rem;
        }

        #total {
            color: var(--accent);
            font-weight: 800;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container">
        <div class="calc-container">
            <h2 class="mb-4 fw-bold">Price Estimator</h2>

            <div class="movie-picker">
                <label class="d-block text-muted mb-2 small text-uppercase">Select Movie</label>
                <select id="movie">
                    <option value="10">Avengers: Endgame ($10)</option>
                    <option value="12">Joker ($12)</option>
                    <option value="8">Toy Story 4 ($8)</option>
                    <option value="9">The Lion King ($9)</option>
                </select>
            </div>

            <div class="screen"></div>

            <div class="seats-area">
                <div class="row">
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                </div>
                <div class="row">
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                </div>
                <div class="row">
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat occupied"></div>
                    <div class="seat occupied"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                </div>
                <div class="row">
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                    <div class="seat"></div>
                </div>
            </div>

            <div class="summary">
                You have selected <span id="count" style="color: var(--accent); font-weight: 700;">0</span> seats for a
                price of <span id="total">$0</span>
            </div>

            <a href="/movies" class="button mt-4 d-block">Ready to Book?</a>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>

    <script>
        const container = document.querySelector('.container');
        const seats = document.querySelectorAll('.row .seat:not(.occupied)');
        const count = document.getElementById('count');
        const total = document.getElementById('total');
        const movieSelect = document.getElementById('movie');

        let ticketPrice = +movieSelect.value;

        function updateSelectedCount() {
            const selectedSeats = document.querySelectorAll('.row .seat.selected');
            const selectedSeatsCount = selectedSeats.length;
            count.innerText = selectedSeatsCount;
            total.innerText = '$' + (selectedSeatsCount * ticketPrice);
        }

        movieSelect.addEventListener('change', e => {
            ticketPrice = +e.target.value;
            updateSelectedCount();
        });

        document.querySelector('.seats-area').addEventListener('click', e => {
            if (e.target.classList.contains('seat') && !e.target.classList.contains('occupied')) {
                e.target.classList.toggle('selected');
                updateSelectedCount();
            }
        });
    </script>
</body>

</html>
