<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Select Your Seats</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .booking-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .screen {
            width: 100%;
            height: 8px;
            background: #3498db;
            margin: 40px 0 60px;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.4);
            position: relative;
        }

        .screen::after {
            content: 'SCREEN';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #64748b;
            font-size: 0.8rem;
            letter-spacing: 5px;
        }

        .seat-grid {
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .seat-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .row-label {
            width: 30px;
            font-weight: 700;
            color: #94a3b8;
        }

        .seat-box {
            position: relative;
            width: 35px;
            height: 35px;
        }

        .seat-box input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .seat-display {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #334155;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .seat-box:hover .seat-display {
            background: #475569;
            transform: scale(1.1);
        }

        .seat-box input:checked+.seat-display {
            background: #e74c3c;
            color: white;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.4);
        }

        .seat-box input:disabled+.seat-display {
            background: #0f172a;
            color: #475569;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 18px;
            height: 18px;
            border-radius: 4px;
        }

        .btn-confirm {
            margin-top: 40px;
            width: 100%;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container">
        <div class="booking-container">
            <h1 th:text="${movieName}" style="margin-top: 0;">Movie Title</h1>
            <p style="color: #94a3b8;"><span th:text="${date}">Date</span> | <span th:text="${time}">Time</span></p>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box" style="background: #334155;"></div>
                    <span>Available</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: #e74c3c;"></div>
                    <span>Selected</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background: #0f172a; opacity: 0.5;"></div>
                    <span>Booked</span>
                </div>
            </div>

            <div class="screen"></div>

            <form action="/confirm-booking" method="POST">
                <div class="seat-grid">
                    <th:block th:each="rowChar : ${#strings.arraySplit('A,B,C,D,E',',')}">
                        <div class="seat-row">
                            <span class="row-label" th:text="${rowChar}"></span>
                            <th:block th:each="i : ${#numbers.sequence(1, 10)}">
                                <div class="seat-box">
                                    <input type="checkbox" th:value="${rowChar + i}" name="seat" th:id="${rowChar + i}"
                                        th:disabled="${UnAvailSeats != null and #lists.contains(UnAvailSeats, rowChar + i)}">
                                    <label th:for="${rowChar + i}" class="seat-display"
                                        th:text="${rowChar + i}"></label>
                                </div>
                            </th:block>
                        </div>
                    </th:block>
                </div>
                <button type="submit" class="button btn-confirm">Confirm Booking</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>

</body>

</html>
