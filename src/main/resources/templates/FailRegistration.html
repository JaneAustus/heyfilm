<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Registration Failed - HeyFilm</title>
    <style>
        .feedback-container {
            max-width: 500px;
            margin: 100px auto;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
    </style>
</head>

<body class="bg-light">
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container">
        <div class="feedback-container">
            <div style="font-size: 4rem; color: #e74c3c; margin-bottom: 20px;">❌</div>
            <h1 style="color: var(--primary); font-weight: 800; margin-bottom: 15px;">Registration Failed</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Oops! Something went wrong during your
                registration. The username or email might already be in use. Please check your details and try again.
            </p>
            <a th:href="@{/Register}" class="button">Back to Registration</a>
        </div>
    </div>
    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>
</body>

</html>
