<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Contact Us - HeyFilm</title>
    <style>
        .contact-container {
            max-width: 800px;
            margin: 60px auto;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: var(--shadow);
        }

        .contact-info {
            background: var(--primary);
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-info h2 {
            font-weight: 800;
            margin-bottom: 2rem;
            color: white;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-icon {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        .contact-form {
            padding: 50px;
        }

        .contact-form h3 {
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: #f8fafc;
            border: 1.5px solid #edf2f7;
            border-radius: 10px;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            background: white;
        }

        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
                margin: 20px;
            }

            .contact-info {
                padding: 40px;
            }

            .contact-form {
                padding: 40px;
            }
        }
    </style>
</head>

<body class="bg-light">

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container">
        <div class="contact-container">
            <div class="contact-info">
                <h2>Contact Information</h2>
                <p style="margin-bottom: 2rem; opacity: 0.7;">Say something to start a live chat!</p>

                <div class="info-item">
                    <span class="info-icon">📞</span>
                    <span>+91 12345 67890</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">✉️</span>
                    <span>support@HeyFilm.com</span>
                </div>
                <div class="info-item">
                    <span class="info-icon">📍</span>
                    <span>123 Movie Lane, Cinema City</span>
                </div>

                <div style="margin-top: auto; display: flex; gap: 20px; font-size: 1.5rem;">
                    <span>🕊️</span> <span>📸</span> <span>📘</span>
                </div>
            </div>

            <div class="contact-form">
                <h3>Get in Touch</h3>
                <form action="#">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Enter your email address">
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea rows="4" placeholder="Enter your message"></textarea>
                    </div>
                    <button type="button" class="button" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>

</body>

</html>
