<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="header_head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        :root {
            --nav-bg: rgba(44, 62, 80, 0.9);
            --nav-text: #ecf0f1;
            --nav-hover: #3498db;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #2c3e50;
        }

        header {
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--nav-text);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header nav {
            display: flex;
            gap: 20px;
        }

        header nav a {
            color: var(--nav-text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 0;
            opacity: 0.8;
            transition: var(--transition);
        }

        header nav a:hover {
            opacity: 1;
            color: var(--white);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 25px;
            transition: var(--transition);
        }

        .search-bar:focus-within {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.5);
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            padding: 5px;
            width: 150px;
            font-size: 0.9rem;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-bar button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0;
            display: flex;
            align-items: center;
        }
    </style>
</head>

<body>

    <header th:fragment="navbar">
        <a href="/home" class="logo">
            <span style="background: var(--accent); color: white; padding: 2px 8px; border-radius: 4px;">M</span>
            HeyFilm
        </a>

        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="nav-links">
            <a href="/home">Home</a>
            <a href="/movies">Movies</a>
            <a href="/showTime">Showtimes</a>
            <a href="/Bookings">Bookings</a>
            <a href="/contectUs">Contact</a>
        </nav>

        <div class="search-bar">
            <form action="/search" method="GET" style="display: flex; align-items: center;">
                <input type="text" name="query" placeholder="Search movies..." required>
                <button type="submit">🔍</button>
            </form>
        </div>

        <script th:fragment="nav_script">
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('nav-links');

            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                hamburger.classList.toggle('open');
            });

            // Close menu when clicking outside
            document.addEventListener('click', (e) => {
                if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) {
                    navLinks.classList.remove('active');
                    hamburger.classList.remove('open');
                }
            });
        </script>
    </header>

    <footer th:fragment="footer"
        style="background: #1a252f; color: #bdc3c7; padding: 4rem 2rem 2rem; margin-top: 5rem;">
        <div
            style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem;">
            <div>
                <h3 style="color: white; margin-bottom: 1.5rem;">HeyFilm</h3>
                <p style="font-size: 0.9rem; line-height: 1.6;">Experience the best cinema entertainment with our
                    seamless ticket booking platform. Your gateway to the latest movies.</p>
            </div>
            <div>
                <h4 style="color: white; margin-bottom: 1.5rem;">Quick Links</h4>
                <ul style="list-style: none; padding: 0; font-size: 0.9rem;">
                    <li style="margin-bottom: 0.8rem;"><a href="/home"
                            style="color: inherit; text-decoration: none;">Home</a></li>
                    <li style="margin-bottom: 0.8rem;"><a href="/movies"
                            style="color: inherit; text-decoration: none;">Movies</a></li>
                    <li style="margin-bottom: 0.8rem;"><a href="/terms"
                            style="color: inherit; text-decoration: none;">Terms of Service</a></li>
                </ul>
            </div>
            <div>
                <h4 style="color: white; margin-bottom: 1.5rem;">Support</h4>
                <ul style="list-style: none; padding: 0; font-size: 0.9rem;">
                    <li style="margin-bottom: 0.8rem;"><a href="/FAQ"
                            style="color: inherit; text-decoration: none;">FAQ</a></li>
                    <li style="margin-bottom: 0.8rem;"><a href="/privecy"
                            style="color: inherit; text-decoration: none;">Privacy Policy</a></li>
                    <li style="margin-bottom: 0.8rem;"><a href="/contectUs"
                            style="color: inherit; text-decoration: none;">Contact Support</a></li>
                </ul>
            </div>
        </div>
        <div
            style="max-width: 1200px; margin: 2rem auto 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2rem; text-align: center; font-size: 0.85rem;">
        </div>
    </footer>

</body>

</html>
