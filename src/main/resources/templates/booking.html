<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Book Tickets - HeyFilm Premium</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .page-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .page-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1rem;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Styling select dropdown items */
        .form-group select option {
            background-color: #1e293b;
            color: white;
        }

        .btn-submit {
            width: 100%;
            margin-top: 2rem;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

            .page-container {
                margin: 20px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container">
        <div class="page-container">
            <h2>Book Your Experience</h2>
            <form action="/BookingDTLS" method="GET">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="movie">Select Movie</label>
                        <select id="movie" name="movie">
                            <option value="MERSAL">MERSAL</option>
                            <option value="NAISEKER">NAAISEKER</option>
                            <option value="LEGENT">LEGENT</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="showtime">Showtime</label>
                        <select id="showtime" name="showtime">
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="1:00 PM">1:00 PM</option>
                            <option value="4:00 PM">4:00 PM</option>
                            <option value="7:00 PM">7:00 PM</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="showDate">Show Date</label>
                        <input type="date" id="showDate" name="showDate" required />
                    </div>

                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email address">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                    </div>
                </div>

                <button type="submit" class="button btn-submit">Proceed to Seat Selection</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>

</body>

</html>
