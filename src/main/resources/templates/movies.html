<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Movies - HeyFilm Premium</title>
    <style>
        .page-header {
            padding: 80px 0;
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            margin-bottom: 60px;
        }

        .page-header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .page-header p {
            font-size: 1.25rem;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>

<body class="bg-light">

    <div th:replace="~{fragments :: navbar}"></div>

    <section class="page-header">
        <div class="container">
            <h1>Now Showing</h1>
            <p>Explore the latest releases and pick your next cinematic adventure.</p>
        </div>
    </section>

    <div class="container mb-5">
        <div class="movie-grid">
            <!-- Movie 1 -->
            <div class="movie-card">
                <div class="movie-poster">
                    <img src="merasal.jpg" alt="Mersal"
                        onerror="this.src='https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=500&q=80'">
                    <div class="movie-badge">5.0 ★</div>
                </div>
                <div class="movie-info">
                    <h3>MERSAL</h3>
                    <p class="movie-genre">Action | Drama | Thriller</p>
                    <a th:href="@{/movie-details(movie='merasal')}" class="button">View Details</a>
                </div>
            </div>

            <!-- Movie 2 -->
            <div class="movie-card">
                <div class="movie-poster">
                    <img src="legent.jpg" alt="The Legend"
                        onerror="this.src='https://images.unsplash.com/photo-1542204172-8921ec447dcb?auto=format&fit=crop&w=500&q=80'">
                    <div class="movie-badge">3.0 ★</div>
                </div>
                <div class="movie-info">
                    <h3>THE LEGEND</h3>
                    <p class="movie-genre">Sci-Fi | Action | Drama</p>
                    <a th:href="@{/movie-details(movie='legent')}" class="button">View Details</a>
                </div>
            </div>

            <!-- Movie 3 -->
            <div class="movie-card">
                <div class="movie-poster">
                    <img src="naaisekar.jpg" alt="Naaisekar"
                        onerror="this.src='https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&w=500&q=80'">
                    <div class="movie-badge">4.0 ★</div>
                </div>
                <div class="movie-info">
                    <h3>NAAISEKER</h3>
                    <p class="movie-genre">Comedy | Drama | Family</p>
                    <a th:href="@{/movie-details(movie='naaisekar')}" class="button">View Details</a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>

</body>

</html>
