<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Seat Selection Demo - HeyFilm</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .booking-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .screen {
            width: 100%;
            height: 6px;
            background: #3498db;
            margin: 40px 0 60px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
            position: relative;
        }

        .screen::after {
            content: 'SCREEN';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: #64748b;
        }

        .seat-grid {
            margin-bottom: 40px;
        }

        .seat-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .seat {
            width: 35px;
            height: 35px;
            background: #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .seat:hover {
            background: #475569;
            transform: scale(1.1);
        }

        .seat.selected {
            background: #e74c3c;
            color: white;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.4);
        }

        .seat.taken {
            background: #0f172a;
            color: #475569;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .selection-panel {
            background: #0f172a;
            padding: 25px;
            border-radius: 12px;
            text-align: left;
        }

        #selected-seats-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .seat-badge {
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container">
        <div class="booking-container">
            <h2 class="mb-2 fw-bold">Demo Seat Selection</h2>
            <p class="text-muted small mb-5">Experience our interactive seat map</p>

            <div class="screen"></div>

            <div class="seat-grid">
                <!-- Rows -->
                <th:block th:each="row : ${#strings.arraySplit('A,B,C,D,E', ',')}">
                    <div class="seat-row">
                        <th:block th:each="col : ${#numbers.sequence(1, 10)}">
                            <div class="seat" th:attr="data-seat=${row + col}"
                                th:classappend="${row == 'A' and col == 5} ? 'taken' : ''" th:text="${row + col}"></div>
                        </th:block>
                    </div>
                </th:block>
            </div>

            <div class="selection-panel">
                <h4 class="fw-bold mb-0" style="font-size: 1rem;">Selected Seats:</h4>
                <div id="selected-seats-list">
                    <span class="text-muted italic small">No seats selected</span>
                </div>
                <button class="button w-100 mt-4" onclick="handleBooking()">Book Selected Seats</button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>

    <script>
        const seats = document.querySelectorAll('.seat');
        const list = document.getElementById('selected-seats-list');

        seats.forEach(seat => {
            seat.addEventListener('click', () => {
                if (!seat.classList.contains('taken')) {
                    seat.classList.toggle('selected');
                    updateUI();
                }
            });
        });

        function updateUI() {
            const selected = document.querySelectorAll('.seat.selected');
            if (selected.length === 0) {
                list.innerHTML = '<span class="text-muted italic small">No seats selected</span>';
                return;
            }

            list.innerHTML = '';
            selected.forEach(s => {
                const badge = document.createElement('span');
                badge.className = 'seat-badge';
                badge.innerText = s.getAttribute('data-seat');
                list.appendChild(badge);
            });
        }

        function handleBooking() {
            const selected = document.querySelectorAll('.seat.selected');
            if (selected.length === 0) {
                alert('Please select at least one seat.');
                return;
            }
            const seatNames = Array.from(selected).map(s => s.getAttribute('data-seat')).join(',');
            alert('Booking seats: ' + seatNames);
        }
    </script>
</body>

</html>
