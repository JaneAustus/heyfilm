<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Booking Confirmed!</title>
    <style>
        .success-card {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .success-icon {
            font-size: 80px;
            color: #2ecc71;
            margin-bottom: 30px;
            animation: bounceIn 0.8s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        .details-list {
            background: #f8fafc;
            padding: 30px;
            border-radius: 12px;
            margin: 30px 0;
            text-align: left;
            display: inline-block;
            min-width: 300px;
        }

        .details-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .details-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }
    </style>
</head>

<body class="bg-light">

    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container">
        <div class="success-card">
            <div class="success-icon">✅</div>
            <h1 style="color: var(--primary); font-weight: 800; margin-bottom: 10px;">Booking Confirmed!</h1>
            <p style="color: var(--text-muted);">Thank you for choosing HeyFilm. Your tickets are ready!</p>

            <div class="details-list">
                <div class="details-item">
                    <span>Movie</span>
                    <strong th:text="${movieName}">Mersal</strong>
                </div>
                <div class="details-item">
                    <span>Seats</span>
                    <strong th:text="${seats}">A1, A2</strong>
                </div>
                <div class="details-item">
                    <span>Showtime</span>
                    <strong th:text="${time}">10:30 PM</strong>
                </div>
                <div class="details-item">
                    <span>Total Paid</span>
                    <strong th:text="${'₹' + price}">₹300</strong>
                </div>
            </div>

            <a href="/home" class="button"
                style="display: inline-block; text-decoration: none; padding: 15px 40px;">Return to Home</a>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>

</body>

</html>
