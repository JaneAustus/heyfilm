<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{fragments :: header_head}"></div>
    <title>Registration Successful - HeyFilm</title>
    <style>
        .feedback-container {
            max-width: 500px;
            margin: 100px auto;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
    </style>
</head>

<body class="bg-light">
    <div th:replace="~{fragments :: navbar}"></div>
    <div class="container">
        <div class="feedback-container">
            <div style="font-size: 4rem; color: #2ecc71; margin-bottom: 20px;">🎉</div>
            <h1 style="color: var(--primary); font-weight: 800; margin-bottom: 15px;">Registration Successful!</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Welcome to HeyFilm! Your account has been
                created successfully. You can now log in and start booking your favorite movies.</p>
            <a th:href="@{/login}" class="button">Go to Login</a>
        </div>
    </div>
    <div th:replace="~{fragments :: footer}"></div>
    <div th:replace="~{fragments :: nav_script}"></div>
</body>

</html>
