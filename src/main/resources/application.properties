# ================= SERVER PORT =================
server.port=${PORT:8080}

# ================= DATABASE (PostgreSQL) =================
# Set DATABASE_URL to your Render PostgreSQL Internal/External URL
# Note: Render provides DATABASE_URL, but you may need to prepend 'jdbc:' if you use it directly
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/movie_booking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================= APPLICATION =================
spring.application.name=Movie Ticket Booking
debug=true
logging.level.org.springframework.boot=ERROR

